name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp roads_tiles_manifest.json _site/
          cp blm_public_roads_tiles_manifest.json _site/
          cp .nojekyll _site/
          rsync -a vendor/ _site/vendor/
          rsync -a _roads_tiles/ _site/_roads_tiles/
          rsync -a _blm_roads_tiles/ _site/_blm_roads_tiles/
          mkdir -p _site/vector_tiles
          cp vector_tiles/forest_roads.pmtiles _site/vector_tiles/
          cp vector_tiles/forest_roads_staging_manifest.json _site/vector_tiles/
          cp vector_tiles/blm_public_roads.pmtiles _site/vector_tiles/
          cp vector_tiles/blm_public_roads_staging_manifest.json _site/vector_tiles/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
